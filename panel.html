<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zid order</title>
<style>
  *{box-sizing:border-box}
  html{scrollbar-width:thin;scrollbar-color:#c3c7c3 transparent}
  body{margin:0;background:#f4f5f4;color:#1f2937;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  .top{position:sticky;top:0;z-index:3;padding:10px 12px;background:#14532d;color:#fff}
  /* the order number is never cut: when the buttons do not fit beside it they wrap to the next line */
  .r1{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .num{flex:1 0 auto;display:flex;align-items:center;gap:6px}
  .num h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;unicode-bidi:plaintext}
  .acts{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
  .r2{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;opacity:.95}
  .chip{padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.18);font-size:11px;white-space:nowrap;unicode-bidi:plaintext}
  .ib{display:grid;place-items:center;width:28px;height:28px;flex:none;padding:0;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;cursor:pointer}
  .ib:hover{background:rgba(255,255,255,.26)}
  .ib:disabled{opacity:.5;cursor:wait}
  .lang{height:24px;padding:0 9px;border:1px solid rgba(255,255,255,.5);border-radius:99px;background:transparent;color:#fff;font:600 11px/1 inherit;cursor:pointer;white-space:nowrap}
  .lang:hover{background:rgba(255,255,255,.14)}
  .lang:disabled{opacity:.6;cursor:wait}
  .cp{display:grid;place-items:center;width:30px;height:28px;flex:none;padding:0;border:1px solid #d6dad6;border-radius:8px;background:#fff;color:#14532d;cursor:pointer;transition:background .15s,color .15s}
  .cp:hover{background:#f0fdf4}
  .cp.done{border-color:#14532d;background:#14532d;color:#fff}
  .top .cp{width:26px;height:24px;border-color:rgba(255,255,255,.45);background:transparent;color:#fff}
  .top .cp:hover{background:rgba(255,255,255,.14)}
  .top .cp.done{background:#fff;color:#14532d}
  main{padding:10px}
  .banner{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:#fee2e2;color:#991b1b;font-weight:700}
  .banner p{margin:4px 0 0;font-weight:400;font-size:12px}
  .warn{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:12px}
  .warn p{margin:2px 0}
  .card{margin-bottom:10px;overflow:hidden;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
  .card > h2{margin:0;padding:8px 12px;background:#fafbfa;color:#4b5563;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .rows{border-top:1px solid #eef0ee}
  .row{display:grid;grid-template-columns:minmax(80px,38%) 1fr 30px;align-items:center;gap:8px;min-height:38px;padding:5px 8px 5px 12px;border-top:1px solid #f2f3f2}
  .row:first-child{border-top:0}
  .lab{color:#6b7280;font-size:12px}
  .val{min-width:0;font-weight:600;overflow-wrap:anywhere;unicode-bidi:plaintext}
  .empty{padding:40px 20px;color:#6b7280;text-align:center}
  .empty b{display:block;margin-bottom:6px;color:#1f2937;font-size:15px}
  .loading{padding:30px;color:#6b7280;text-align:center}
  .spin{display:inline-block;width:16px;height:16px;margin-right:8px;vertical-align:-3px;border:2px solid #cbd5cb;border-top-color:#14532d;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:14px;z-index:5;transform:translateX(-50%);padding:7px 12px;border-radius:8px;background:#111827;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="fields.js"></script>
<script src="extract.js"></script>
<script src="panel.js"></script>
</body>
</html>
